<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>رحلة المعرفة | لعبة تعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============ Design tokens ============ */
  :root{
    --night:#181129;
    --night-deep:#100b1e;
    --surface:#241a3f;
    --surface-2:#2e2252;
    --line: rgba(245,241,255,0.10);
    --ink:#f3efff;
    --ink-dim:#b3a6d9;
    --gold:#f6b93b;
    --gold-deep:#e0a020;
    --mint:#3ddc97;
    --coral:#ff6b6b;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --shadow-deep: 0 30px 60px -20px rgba(8,4,20,0.65);
    --font-display: 'Baloo Bhaijaan 2', 'Tajawal', sans-serif;
    --font-body: 'Tajawal', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(246,185,59,0.10), transparent 45%),
      radial-gradient(circle at 85% 88%, rgba(61,220,151,0.08), transparent 40%),
      linear-gradient(160deg, var(--night) 0%, var(--night-deep) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    overflow-x:hidden;
  }

  /* subtle floating stars in background */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .stars span{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background: var(--gold); opacity:.35;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.7; transform:scale(1.6);} }

  .app{
    position:relative; z-index:1;
    width:100%; max-width: 560px;
  }

  .screen{ display:none; animation: rise .5s cubic-bezier(.2,.8,.2,1); }
  .screen.active{ display:block; }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

  /* ============ Home screen ============ */
  .home-card{
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 48px 32px 32px;
    text-align:center;
    box-shadow: var(--shadow-deep);
    position:relative;
    overflow:hidden;
  }
  .home-card::before{
    content:"";
    position:absolute; top:-60%; right:-40%;
    width:280px; height:280px; border-radius:50%;
    background: radial-gradient(circle, rgba(246,185,59,0.25), transparent 70%);
  }
  .logo-badge{
    width:88px; height:88px; margin:0 auto 20px;
    border-radius: 26px;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    background: linear-gradient(145deg, var(--gold), var(--gold-deep));
    box-shadow: 0 14px 30px -10px rgba(246,185,59,0.55);
    transform: rotate(-6deg);
  }
  .eyebrow{
    font-size:13px; letter-spacing:.12em; color:var(--ink-dim);
    text-transform:uppercase; margin-bottom:10px; font-weight:700;
  }
  h1.title{
    font-family: var(--font-display);
    font-size: 34px;
    font-weight:800;
    line-height:1.25;
    background: linear-gradient(90deg, #fff, var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px;
  }
  .subtitle{
    color: var(--ink-dim); font-size:15.5px; line-height:1.7; margin-bottom:32px;
    max-width: 380px; margin-left:auto; margin-right:auto;
  }
  .btn{
    font-family: var(--font-display);
    font-weight:700;
    font-size:17px;
    border:none; cursor:pointer;
    border-radius: 999px;
    padding: 16px 40px;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{
    background: linear-gradient(90deg, var(--gold), var(--gold-deep));
    color: #241705;
    box-shadow: 0 14px 30px -12px rgba(246,185,59,0.7);
  }
  .btn-primary:hover{ box-shadow: 0 18px 34px -10px rgba(246,185,59,0.85); }
  .btn-primary:disabled{ opacity:.55; cursor:progress; }
  .btn-ghost{
    background: transparent; color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover{ background: rgba(255,255,255,0.05); }

  .home-meta{
    margin-top:28px; display:flex; justify-content:center; gap:22px;
    font-size:12.5px; color: var(--ink-dim);
  }
  .home-meta b{ color:var(--ink); display:block; font-size:17px; font-family:var(--font-display); }

  footer.copyright{
    text-align:center; margin-top:22px; font-size:12px; color: var(--ink-dim); opacity:.7;
  }

  .status-msg{
    margin-top:18px; font-size:13.5px; color: var(--ink-dim); min-height:18px;
  }
  .status-msg.error{ color: var(--coral); }

  /* ============ Game screen ============ */
  .game-card{
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 26px 24px 28px;
    box-shadow: var(--shadow-deep);
  }
  .game-top{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;
  }
  .q-counter{ font-size:13px; color: var(--ink-dim); font-weight:700; letter-spacing:.03em; }
  .q-counter b{ color: var(--gold); font-size:15px; }

  .timer-ring{ position:relative; width:52px; height:52px; }
  .timer-ring svg{ transform: rotate(-90deg); width:52px; height:52px; }
  .timer-ring circle{ fill:none; stroke-width:5; }
  .timer-track{ stroke: rgba(255,255,255,0.08); }
  .timer-bar{ stroke: var(--gold); stroke-linecap:round; transition: stroke-dashoffset 1s linear, stroke .3s ease; }
  .timer-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:16px;
  }

  .dots{ display:flex; gap:6px; margin-bottom:22px; }
  .dot{ flex:1; height:6px; border-radius:4px; background: rgba(255,255,255,0.08); overflow:hidden; }
  .dot i{ display:block; height:100%; width:0%; background: var(--gold); transition: width .3s ease; }
  .dot.done i{ width:100%; background: var(--mint); }
  .dot.wrong i{ width:100%; background: var(--coral); }
  .dot.current i{ width:100%; }

  .question-text{
    font-family: var(--font-display);
    font-size: 21px; font-weight:700; line-height:1.55;
    margin-bottom: 22px; min-height: 90px;
  }

  .options{ display:flex; flex-direction:column; gap:12px; }
  .option{
    display:flex; align-items:center; gap:12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    text-align:right;
    font-family: var(--font-body); font-size:15.5px; font-weight:500;
    color: var(--ink);
    cursor:pointer;
    transition: all .18s ease;
  }
  .option:hover{ background: rgba(255,255,255,0.08); border-color: rgba(246,185,59,0.4); }
  .option .letter{
    flex-shrink:0; width:30px; height:30px; border-radius:9px;
    background: rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:14px;
  }
  .option.correct{ background: rgba(61,220,151,0.14); border-color: var(--mint); }
  .option.correct .letter{ background: var(--mint); color:#0a2a1c; }
  .option.wrong{ background: rgba(255,107,107,0.14); border-color: var(--coral); }
  .option.wrong .letter{ background: var(--coral); color:#360a0a; }
  .option.disabled{ pointer-events:none; opacity:.65; }
  .option.disabled.correct, .option.disabled.wrong{ opacity:1; }

  /* ============ Result screen ============ */
  .result-card{
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 34px 26px 26px;
    box-shadow: var(--shadow-deep);
    text-align:center;
  }
  .score-ring{ width:150px; height:150px; margin: 0 auto 18px; position:relative; }
  .score-ring svg{ transform: rotate(-90deg); width:150px; height:150px; }
  .score-ring circle{ fill:none; stroke-width:10; }
  .score-track{ stroke: rgba(255,255,255,0.08); }
  .score-bar{ stroke: var(--gold); stroke-linecap:round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
  .score-num{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-num b{ font-family: var(--font-display); font-size:34px; font-weight:800; }
  .score-num span{ font-size:12px; color: var(--ink-dim); }

  .result-title{ font-family: var(--font-display); font-size:22px; font-weight:700; margin-bottom:6px; }
  .result-sub{ color: var(--ink-dim); font-size:14px; margin-bottom:26px; }

  .review-list{ display:flex; flex-direction:column; gap:12px; text-align:right; margin-bottom:26px; }
  .review-item{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }
  .review-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .review-badge{
    flex-shrink:0; width:24px; height:24px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; margin-top:2px;
  }
  .review-badge.ok{ background: rgba(61,220,151,0.18); color: var(--mint); }
  .review-badge.bad{ background: rgba(255,107,107,0.18); color: var(--coral); }
  .review-q{ font-weight:700; font-size:14.5px; line-height:1.5; }
  .review-answer{ font-size:13px; color: var(--ink-dim); margin-bottom:6px; }
  .review-answer b{ color: var(--mint); }
  .review-explain{
    font-size:13px; line-height:1.7; color: var(--ink-dim);
    background: rgba(255,255,255,0.03); border-radius:10px; padding:10px 12px;
    border-right: 3px solid var(--gold);
  }

  @media (max-width:480px){
    .home-card, .game-card, .result-card{ padding-left:18px; padding-right:18px; }
    h1.title{ font-size:28px; }
    .question-text{ font-size:18.5px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">

  <!-- ============ HOME SCREEN ============ -->
  <section id="screen-home" class="screen active">
    <div class="home-card">
      <div class="logo-badge">🧠</div>
      <div class="eyebrow">لعبة تعليمية تفاعلية</div>
      <h1 class="title">رحلة المعرفة</h1>
      <p class="subtitle">اختبر معلوماتك عبر 10 أسئلة عشوائية، وسابق الوقت، واجمع أعلى نتيجة ممكنة!</p>
      <button class="btn btn-primary" id="btn-start">ابدأ الجولة</button>
      <div class="status-msg" id="home-status"></div>
      <div class="home-meta">
        <div><b>10</b>أسئلة</div>
        <div><b>15</b>ثانية لكل سؤال</div>
        <div><b>∞</b>محاولات</div>
      </div>
    </div>
    <footer class="copyright">© 2026 رحلة المعرفة — جميع الحقوق محفوظة</footer>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="screen-game" class="screen">
    <div class="game-card">
      <div class="game-top">
        <div class="q-counter">السؤال <b id="q-index">1</b> / <span id="q-total">10</span></div>
        <div class="timer-ring">
          <svg viewBox="0 0 52 52">
            <circle class="timer-track" cx="26" cy="26" r="22"></circle>
            <circle class="timer-bar" id="timer-bar" cx="26" cy="26" r="22"></circle>
          </svg>
          <div class="timer-num" id="timer-num">15</div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
      <div class="question-text" id="question-text">جارِ التحميل...</div>
      <div class="options" id="options"></div>
    </div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="score-ring">
        <svg viewBox="0 0 150 150">
          <circle class="score-track" cx="75" cy="75" r="65"></circle>
          <circle class="score-bar" id="score-bar" cx="75" cy="75" r="65"></circle>
        </svg>
        <div class="score-num"><b id="score-value">0/10</b><span>نتيجتك</span></div>
      </div>
      <div class="result-title" id="result-title">أحسنت!</div>
      <div class="result-sub" id="result-sub">راجع إجاباتك أدناه</div>
      <div class="review-list" id="review-list"></div>
      <button class="btn btn-primary" id="btn-again">إعادة اللعب</button>
    </div>
  </section>

</div>

<script>
  /* ======================================================
     إعدادات الاتصال بـ Supabase
     ضع مفتاح anon public key الخاص بك هنا فقط 👇
  ====================================================== */
  const SUPABASE_URL = "https://umnmlkietrxxmgowlqej.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_LGPzor6AYm9dPF00moLIww_QoQrsDlh";
  const TABLE_NAME = "questions";
  const QUESTIONS_PER_ROUND = 10;
  const SECONDS_PER_QUESTION = 15;

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ======================================================
     عناصر DOM
  ====================================================== */
  const screens = {
    home: document.getElementById('screen-home'),
    game: document.getElementById('screen-game'),
    result: document.getElementById('screen-result'),
  };
  const btnStart = document.getElementById('btn-start');
  const btnAgain = document.getElementById('btn-again');
  const homeStatus = document.getElementById('home-status');

  const qIndexEl = document.getElementById('q-index');
  const qTotalEl = document.getElementById('q-total');
  const dotsEl = document.getElementById('dots');
  const questionTextEl = document.getElementById('question-text');
  const optionsEl = document.getElementById('options');
  const timerBar = document.getElementById('timer-bar');
  const timerNum = document.getElementById('timer-num');

  const scoreBar = document.getElementById('score-bar');
  const scoreValueEl = document.getElementById('score-value');
  const resultTitleEl = document.getElementById('result-title');
  const resultSubEl = document.getElementById('result-sub');
  const reviewListEl = document.getElementById('review-list');

  /* ======================================================
     حالة اللعبة
  ====================================================== */
  let roundQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let timerInterval = null;
  let timeLeft = SECONDS_PER_QUESTION;
  let answered = false;
  let userAnswers = []; // { question, chosen, correct, isRight }

  const TIMER_RADIUS = 22;
  const TIMER_CIRC = 2 * Math.PI * TIMER_RADIUS;
  timerBar.style.strokeDasharray = TIMER_CIRC;

  const SCORE_RADIUS = 65;
  const SCORE_CIRC = 2 * Math.PI * SCORE_RADIUS;
  scoreBar.style.strokeDasharray = SCORE_CIRC;
  scoreBar.style.strokeDashoffset = SCORE_CIRC;

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ======================================================
     جلب الأسئلة من Supabase (10 أسئلة عشوائية)
  ====================================================== */
  async function fetchRandomQuestions(){
    // نجلب كل الأسئلة ثم نخلطها ونأخذ العدد المطلوب.
    // لجداول كبيرة جداً، يفضّل إنشاء RPC في Supabase لسحب عيّنة عشوائية من السيرفر مباشرة.
    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .select('id, question_text, option_a, option_b, option_c, option_d, correct_option, explanation');

    if(error) throw error;
    if(!data || data.length === 0) throw new Error('لا توجد أسئلة في قاعدة البيانات.');

    return shuffle(data).slice(0, QUESTIONS_PER_ROUND);
  }

  /* ======================================================
     بدء الجولة
  ====================================================== */
  btnStart.addEventListener('click', async () => {
    homeStatus.classList.remove('error');
    homeStatus.textContent = 'جارِ تحميل الأسئلة...';
    btnStart.disabled = true;

    try{
      roundQuestions = await fetchRandomQuestions();
      currentIndex = 0;
      score = 0;
      userAnswers = [];
      buildDots();
      qTotalEl.textContent = roundQuestions.length;
      showScreen('game');
      renderQuestion();
    }catch(err){
      console.error(err);
      homeStatus.classList.add('error');
      homeStatus.textContent = 'تعذّر تحميل الأسئلة. تأكد من إعداد مفتاح Supabase ثم حاول مجدداً.';
    }finally{
      btnStart.disabled = false;
    }
  });

  btnAgain.addEventListener('click', () => {
    showScreen('home');
    homeStatus.textContent = '';
  });

  /* ======================================================
     شريط النقاط العلوي (تقدم الأسئلة)
  ====================================================== */
  function buildDots(){
    dotsEl.innerHTML = '';
    roundQuestions.forEach(() => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.innerHTML = '<i></i>';
      dotsEl.appendChild(d);
    });
  }

  function updateDot(index, state){
    const dot = dotsEl.children[index];
    if(!dot) return;
    dot.classList.remove('current', 'done', 'wrong');
    dot.classList.add(state);
  }

  /* ======================================================
     عرض سؤال
  ====================================================== */
  function renderQuestion(){
    answered = false;
    const q = roundQuestions[currentIndex];
    qIndexEl.textContent = currentIndex + 1;
    questionTextEl.textContent = q.question_text;
    updateDot(currentIndex, 'current');

    const opts = [
      { key: 'A', text: q.option_a },
      { key: 'B', text: q.option_b },
      { key: 'C', text: q.option_c },
      { key: 'D', text: q.option_d },
    ];

    optionsEl.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.dataset.key = opt.key;
      btn.innerHTML = `<span class="letter">${opt.key}</span><span>${opt.text ?? ''}</span>`;
      btn.addEventListener('click', () => handleAnswer(opt.key));
      optionsEl.appendChild(btn);
    });

    startTimer();
  }

  /* ======================================================
     المؤقت الزمني
  ====================================================== */
  function startTimer(){
    clearInterval(timerInterval);
    timeLeft = SECONDS_PER_QUESTION;
    timerNum.textContent = timeLeft;
    timerBar.style.strokeDashoffset = 0;
    timerBar.style.stroke = 'var(--gold)';

    timerInterval = setInterval(() => {
      timeLeft -= 1;
      timerNum.textContent = Math.max(timeLeft, 0);
      const offset = TIMER_CIRC * (1 - timeLeft / SECONDS_PER_QUESTION);
      timerBar.style.strokeDashoffset = offset;
      if(timeLeft <= 5) timerBar.style.stroke = 'var(--coral)';

      if(timeLeft <= 0){
        clearInterval(timerInterval);
        handleAnswer(null); // انتهى الوقت بدون إجابة
      }
    }, 1000);
  }

  /* ======================================================
     معالجة الإجابة
  ====================================================== */
  function handleAnswer(chosenKey){
    if(answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = roundQuestions[currentIndex];
    const isRight = chosenKey === q.correct_option;
    if(isRight) score += 1;

    userAnswers.push({
      question: q.question_text,
      chosen: chosenKey,
      correctKey: q.correct_option,
      correctText: q[`option_${q.correct_option.toLowerCase()}`],
      explanation: q.explanation,
      isRight,
    });

    updateDot(currentIndex, isRight ? 'done' : 'wrong');

    [...optionsEl.children].forEach(btn => {
      btn.classList.add('disabled');
      if(btn.dataset.key === q.correct_option) btn.classList.add('correct');
      if(chosenKey && btn.dataset.key === chosenKey && !isRight) btn.classList.add('wrong');
    });

    setTimeout(() => {
      currentIndex += 1;
      if(currentIndex < roundQuestions.length){
        renderQuestion();
      }else{
        renderResult();
      }
    }, 1400);
  }

  /* ======================================================
     شاشة النتيجة النهائية
  ====================================================== */
  function renderResult(){
    showScreen('result');
    const total = roundQuestions.length;
    scoreValueEl.textContent = `${score}/${total}`;

    const pct = score / total;
    const offset = SCORE_CIRC * (1 - pct);
    requestAnimationFrame(() => { scoreBar.style.strokeDashoffset = offset; });

    if(pct >= 0.8){
      resultTitleEl.textContent = 'أداء رائع! 🏆';
      resultSubEl.textContent = 'معلوماتك ممتازة، استمر في التعلم.';
    }else if(pct >= 0.5){
      resultTitleEl.textContent = 'أداء جيد 👏';
      resultSubEl.textContent = 'أنت على الطريق الصحيح، حاول مجدداً لتتحسن.';
    }else{
      resultTitleEl.textContent = 'لا بأس، حاول مرة أخرى 💪';
      resultSubEl.textContent = 'راجع الشروحات أدناه لتتعلم المزيد.';
    }

    reviewListEl.innerHTML = '';
    userAnswers.forEach((a, i) => {
      const item = document.createElement('div');
      item.className = 'review-item';
      item.innerHTML = `
        <div class="review-head">
          <div class="review-badge ${a.isRight ? 'ok' : 'bad'}">${a.isRight ? '✓' : '✕'}</div>
          <div class="review-q">${i + 1}. ${a.question}</div>
        </div>
        <div class="review-answer">الإجابة الصحيحة: <b>${a.correctText}</b></div>
        ${a.explanation ? `<div class="review-explain">${a.explanation}</div>` : ''}
      `;
      reviewListEl.appendChild(item);
    });
  }

  /* ======================================================
     نجوم خلفية بسيطة
  ====================================================== */
  (function makeStars(){
    const wrap = document.getElementById('stars');
    for(let i = 0; i < 40; i++){
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 4) + 's';
      wrap.appendChild(s);
    }
  })();
</script>
</body>
</html>
